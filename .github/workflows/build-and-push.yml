name: Build and push worker images

on:
  push:
    branches:
      - main
    paths:
      - "hypa-asr-runpod-worker/**"
      - "hypa-asr-stream-runpod-worker/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        dir:
          - hypa-asr-runpod-worker
          - hypa-asr-stream-runpod-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          file: ./${{ matrix.dir }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.dir }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.dir }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dir }}
